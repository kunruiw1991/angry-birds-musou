<script>
  // Early error capture (smoke/E2E read window.__ERRORS__).
  window.__ERRORS__ = [];
  window.addEventListener('error', function (e) { window.__ERRORS__.push(String(e.message || e) + ' @' + (e.filename || '') + ':' + (e.lineno || 0)); });
  window.addEventListener('unhandledrejection', function (e) { window.__ERRORS__.push('unhandled: ' + String(e.reason && (e.reason.stack || e.reason.message) || e.reason)); });
</script>
